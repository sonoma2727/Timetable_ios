name: iOS Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Timetable.xcodeproj \
            -scheme Timetable \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Timetable.app Payload/
          zip -qry Timetable.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timetable-ipa
          path: Timetable.ipa

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Timetable.ipa
          name: Timetable iOS ${{ github.ref_name }}
          body: |
            SwiftUI 原生 iOS 端 v0.1.0（iOS 16+）。

            **此 IPA 未包含签名**，需用以下任一方式重签后安装：
            - 爱思助手：工具箱 → IPA 签名（用你的 Apple ID，7 天有效）
            - AltStore / Sideloadly（电脑端用 Apple ID 签名，7 天有效）
            - 有付费开发者证书可用 ESign 等直接签名

            功能与 Android 端一致：教务登录、今日页、周课表网格、课程详情、开学日期、同课同色配色；凭据仅存本机 Keychain。
